name: ci

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: pe-mcp-thin:ci

      - name: serve with no config -> fails fast, stdout stays clean
        run: |
          set +e
          docker run --rm ${{ steps.build.outputs.imageid }} \
            1>"$GITHUB_WORKSPACE/.out" 2>"$GITHUB_WORKSPACE/.err"
          status=$?
          set -e
          if [ "${status}" -eq 0 ]; then
            echo "::error::expected a non-zero exit code, got 0"
            exit 1
          fi
          if [ -s "$GITHUB_WORKSPACE/.out" ]; then
            echo "::error::stdout must stay empty on failure (it's the MCP protocol stream)"
            cat "$GITHUB_WORKSPACE/.out"
            exit 1
          fi
          grep -q "PE_MCP_URL is not configured" "$GITHUB_WORKSPACE/.err"
          grep -q "puppetlabs-pe_mcp" "$GITHUB_WORKSPACE/.err"

      - name: validate against an unreachable URL -> clear FAIL, non-zero exit
        run: |
          mkdir -p /tmp/fixture-config
          cat > /tmp/fixture-config/config.env <<'EOF'
          PE_MCP_URL=https://unreachable.invalid/mcp/
          EOF
          cat > /tmp/fixture-config/pe-ca.pem <<'EOF'
          -----BEGIN CERTIFICATE-----
          MIIFAKECERTDATAFORTESTINGPURPOSESONLYTHISISNOTAREALCERT
          -----END CERTIFICATE-----
          EOF
          set +e
          docker run --rm -v /tmp/fixture-config:/config ${{ steps.build.outputs.imageid }} validate
          status=$?
          set -e
          if [ "${status}" -eq 0 ]; then
            echo "::error::expected validate to fail against an unreachable URL"
            exit 1
          fi

      - name: setup writes config.env and pe-ca.pem from piped answers
        run: |
          mkdir -p /tmp/setup-config /tmp/fixture-cert
          cat > /tmp/fixture-cert/pe-ca.pem <<'EOF'
          -----BEGIN CERTIFICATE-----
          MIIFAKECERTDATAFORTESTINGPURPOSESONLYTHISISNOTAREALCERT
          -----END CERTIFICATE-----
          EOF
          # Cert option 2 (mounted file) is used here instead of option 1
          # (paste-until-EOF): `cat > pe-ca.pem` for option 1 reads until stdin
          # truly closes, which would swallow the blank line meant for the
          # RBAC token prompt that follows it.
          printf '1\nhttps://mcp-node.example.com/mcp/\n2\n\n' | \
            docker run --rm -i \
              -v /tmp/setup-config:/config \
              -v /tmp/fixture-cert/pe-ca.pem:/import/pe-ca.pem:ro \
              ${{ steps.build.outputs.imageid }} setup
          # The trailing slash is normalized away before being written.
          grep -qx "PE_MCP_URL=https://mcp-node.example.com/mcp" /tmp/setup-config/config.env
          grep -q "BEGIN CERTIFICATE" /tmp/setup-config/pe-ca.pem
          if [ -f /tmp/setup-config/rbac-token ]; then
            echo "::error::expected no rbac-token file when the token prompt is left blank"
            exit 1
          fi

      - name: setup stores the RBAC token at 0600 and clears it on blank re-entry
        run: |
          mkdir -p /tmp/setup-rbac
          printf '1\nhttps://mcp-node.example.com/mcp\n2\ns3cret-token\n' | \
            docker run --rm -i \
              -v /tmp/setup-rbac:/config \
              -v /tmp/fixture-cert/pe-ca.pem:/import/pe-ca.pem:ro \
              ${{ steps.build.outputs.imageid }} setup
          # The image runs as root and rbac-token is written at mode 0600, so
          # it's unreadable to the runner's own (non-root) user by design —
          # sudo is needed here to check its content. The mode check below
          # deliberately does NOT use sudo: stat only needs directory
          # traversal, not file-read permission, so it also proves the
          # restriction is real (a plain `cat` as the runner user would fail).
          sudo grep -qx "s3cret-token" /tmp/setup-rbac/rbac-token
          mode=$(stat -c '%a' /tmp/setup-rbac/rbac-token)
          if [ "${mode}" != "600" ]; then
            echo "::error::expected rbac-token mode 600, got ${mode}"
            exit 1
          fi
          if grep -q "PE_RBAC_TOKEN\|s3cret-token" /tmp/setup-rbac/config.env; then
            echo "::error::the RBAC token must never be written to config.env"
            exit 1
          fi

          # Re-running setup with a blank token must clear the stale one, so
          # "blank" reliably means "no token" rather than "keep the old one".
          printf '1\nhttps://mcp-node.example.com/mcp\n2\n\n' | \
            docker run --rm -i \
              -v /tmp/setup-rbac:/config \
              -v /tmp/fixture-cert/pe-ca.pem:/import/pe-ca.pem:ro \
              ${{ steps.build.outputs.imageid }} setup
          if [ -f /tmp/setup-rbac/rbac-token ]; then
            echo "::error::expected rbac-token to be cleared on blank re-entry"
            exit 1
          fi

      - name: unknown subcommand -> usage error
        run: |
          set +e
          docker run --rm ${{ steps.build.outputs.imageid }} bogus 2>"$GITHUB_WORKSPACE/.err"
          status=$?
          set -e
          if [ "${status}" -eq 0 ]; then
            echo "::error::expected a non-zero exit code for an unknown subcommand"
            exit 1
          fi
          grep -q "Unknown command" "$GITHUB_WORKSPACE/.err"
